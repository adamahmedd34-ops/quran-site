/* =========================
   المتغيرات
========================= */

let currentCategory="morning";

let counters={};


/* =========================
   الأرقام العربية
========================= */

function ar(n){

return String(n).replace(
/[0-9]/g,
x=>"٠١٢٣٤٥٦٧٨٩"[x]
);

}


/* =========================
   حماية HTML
========================= */

function escapeHTML(text){

return String(text).replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}


/* =========================
   المحفوظات
========================= */

function getSaved(){

try{

return JSON.parse(
localStorage.getItem("savedAzkar")
)||[];

}catch(e){

return[];

}

}


function saveSaved(list){

localStorage.setItem(
"savedAzkar",
JSON.stringify(list)
);

}


/* =========================
   حفظ ذكر
========================= */

function saveZikr(index){

const item=
azkarData[currentCategory][index];

let saved=getSaved();

const exists=
saved.some(
x=>
x.text===item.text
);

if(exists){

alert("❤️ الذكر موجود بالفعل في المحفوظات.");

return;

}

saved.push({

title:item.title,

text:item.text,

type:item.type,

category:currentCategory

});

saveSaved(saved);

renderSaved();

alert("❤️ تم حفظ الذكر.");


}


/* =========================
   حذف ذكر
========================= */

function deleteSaved(index){

let saved=getSaved();

saved.splice(index,1);

saveSaved(saved);

renderSaved();

}


/* =========================
   حذف الكل
========================= */

function clearSaved(){

if(!getSaved().length){

return;

}

if(
confirm("هل تريد حذف جميع الأذكار المحفوظة؟")
){

localStorage.removeItem(
"savedAzkar"
);

renderSaved();

}

}

/* =========================
   عرض القسم
========================= */

function showCategory(category,button){

currentCategory=category;

document
.querySelectorAll(".tab")
.forEach(
x=>x.classList.remove("active")
);

button.classList.add("active");

const titles={

morning:"🌅 أذكار الصباح",

evening:"🌙 أذكار المساء",

general:"🤲 أذكار عامة"

};

document.getElementById(
"categoryTitle"
).textContent=
titles[category];

document.getElementById(
"searchInput"
).value="";

renderAzkar();

}


/* =========================
   عرض الأذكار
========================= */

function renderAzkar(list=null){

const box=
document.getElementById(
"azkarGrid"
);

const data=
list||
azkarData[currentCategory];

document.getElementById(
"countText"
).textContent=
`${ar(data.length)} أذكار`;

if(!data.length){

box.innerHTML=`

<div class="empty">

لا توجد نتائج للبحث.

</div>

`;

return;

}

box.innerHTML=
data.map(
(item,index)=>{

const key=
currentCategory+"_"+index;

const current=
counters[key]||0;

return`

<article class="zikr">

<div class="zikr-head">

<div class="zikr-title">

${escapeHTML(item.title)}

</div>

<div class="zikr-type">

${escapeHTML(item.type)}

</div>

</div>


<div class="zikr-text">

${escapeHTML(item.text)}

</div>


<div class="zikr-info">

🔢 عدد التكرار المقترح:
<strong>

${ar(item.count)}

</strong>

</div>


<div class="zikr-actions">

<button
class="btn btn-save"
onclick="saveZikr(${index})">

❤️ حفظ

</button>


<button
class="btn btn-copy"
onclick="copyText('${encodeURIComponent(item.text)}')">

📋 نسخ

</button>


<button
class="btn btn-share"
onclick="shareText('${encodeURIComponent(item.text)}')">

📤 مشاركة

</button>

</div>


<div class="counter">

<button
onclick="increaseCounter('${key}',${item.count})">

+

</button>

<div
class="counter-number"
id="counter-${key}">

${ar(current)}

</div>

<button
onclick="resetCounter('${key}')">

↻

</button>

<span class="small">

من ${ar(item.count)}

</span>

</div>

</article>

`;

}).join("");

}


/* =========================
   عداد الذكر
========================= */

function increaseCounter(key,max){

if(!counters[key]){

counters[key]=0;

}

if(counters[key]<max){

counters[key]++;

}

const el=
document.getElementById(
"counter-"+key
);

if(el){

el.textContent=
ar(counters[key]);

}

if(
counters[key]===max
){

if(navigator.vibrate){

navigator.vibrate([
100,
50,
100
]);

}

}

}


function resetCounter(key){

counters[key]=0;

const el=
document.getElementById(
"counter-"+key
);

if(el){

el.textContent="٠";

}

}


/* =========================
   البحث
========================= */

function searchAzkar(){

const word=
document.getElementById(
"searchInput"
).value
.trim()
.toLowerCase();

if(!word){

renderAzkar();

return;

}

const data=
azkarData[currentCategory];

const results=
data.filter(
item=>
item.title
.toLowerCase()
.includes(word)
||
item.text
.toLowerCase()
.includes(word)
);

renderAzkar(results);

}


function clearSearch(){

document.getElementById(
"searchInput"
).value="";

renderAzkar();

}


/* =========================
   النسخ
========================= */

async function copyText(encoded){

const text=
decodeURIComponent(encoded);

try{

await navigator.clipboard.writeText(text);

alert("📋 تم نسخ الذكر.");

}catch(e){

alert("تعذر نسخ الذكر.");

}

}


/* =========================
   المشاركة
========================= */

async function shareText(encoded){

const text=
decodeURIComponent(encoded);

const data={

title:"ذكر من سراج",

text:
`🤲 ${text}

📖 سراج
BY ADAM AHMED`

};

if(navigator.share){

try{

await navigator.share(data);

}catch(e){}

}else{

await copyText(
encodeURIComponent(
text
)
);

}

}


/* =========================
   الوضع الليلي
========================= */

function toggleDark(){

document.body
.classList
.toggle("dark");

localStorage.setItem(
"darkMode",
document.body.classList.contains("dark")
);

updateTheme();

}


function updateTheme(){

const dark=
document.body
.classList
.contains("dark");

document.getElementById(
"themeBtn"
).textContent=

dark
?
"☀️ الوضع النهاري"
:
"🌙 الوضع الداكن";

}


if(
localStorage.getItem("darkMode")
==="true"
){

document.body
.classList
.add("dark");

}

updateTheme();


/* =========================
   زر الأعلى
========================= */

window.addEventListener(
"scroll",
()=>{

const button=
document.getElementById(
"topButton"
);

if(window.scrollY>400){

button.style.display="block";

}else{

button.style.display="none";

}

});


/* =========================
   التشغيل
========================= */

renderAzkar();

renderSaved();


</script>
