<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#087f5b">

<meta name="description"
content="سراج - الأذكار والأدعية">

<title>سراج | الأذكار والأدعية | BY ADAM AHMED</title>

<style>

/* =====================================================
   الأساسيات
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --green:#087f5b;
    --green2:#0da47f;
    --green-dark:#064c43;

    --bg:#f3f7f5;
    --card:#ffffff;

    --text:#173b35;
    --muted:#71847f;

    --border:#dce7e2;

    --gold:#c99b28;
    --danger:#d64545;

    --soft:#eaf8f2;
    --soft-gold:#f4ead0;

    --shadow:
        0 8px 25px rgba(0,0,0,.06);

    --radius:18px;
}

body.dark{

    --bg:#09120f;
    --card:#15201d;

    --text:#f3f7f5;
    --muted:#9caeaa;

    --border:#2c3b36;

    --soft:#19372e;
    --soft-gold:#3b321d;

    --shadow:
        0 8px 25px rgba(0,0,0,.25);
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:var(--bg);

    color:var(--text);

    line-height:1.8;

    min-height:100vh;

    transition:
        background .3s,
        color .3s;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:0;
}

button:focus-visible,
input:focus-visible{
    outline:3px solid rgba(13,164,127,.25);
    outline-offset:2px;
}


/* =====================================================
   الهيدر
===================================================== */

.header{

    position:relative;

    text-align:center;

    color:#fff;

    padding:
        30px
        15px
        28px;

    background:
        linear-gradient(
            135deg,
            #064c43,
            #087f5b,
            #15977f
        );

    box-shadow:
        0 5px 20px rgba(0,0,0,.15);

    overflow:hidden;
}

.header::before{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    border-radius:50%;

    background:#ffffff10;

    top:-100px;
    right:-70px;
}

.header::after{

    content:"";

    position:absolute;

    width:160px;
    height:160px;

    border-radius:50%;

    background:#ffffff0b;

    bottom:-80px;
    left:-50px;
}

.creator{

    position:relative;

    z-index:1;

    color:#ffe078;

    font-size:13px;

    font-weight:bold;

    letter-spacing:3px;

    margin-bottom:3px;
}

.logo{

    position:relative;

    z-index:1;

    font-family:
        "Traditional Arabic",
        serif;

    font-size:50px;

    font-weight:bold;

    line-height:1.2;
}

.header p{

    position:relative;

    z-index:1;

    opacity:.9;

    font-size:15px;
}

.theme{

    position:absolute;

    z-index:3;

    left:12px;

    top:12px;

    padding:9px 13px;

    border-radius:12px;

    color:#fff;

    background:#ffffff22;

    border:
        1px solid #ffffff55;

    transition:.2s;
}

.theme:hover{
    background:#ffffff35;
}


/* =====================================================
   شريط التنقل
===================================================== */

.topbar{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;

    padding:12px;

    background:var(--card);

    border-bottom:
        1px solid var(--border);

    position:sticky;

    top:0;

    z-index:50;

    backdrop-filter:blur(12px);
}

.topbar a{

    text-decoration:none;

    color:var(--green);

    font-weight:bold;

    padding:8px 17px;

    border:
        1px solid var(--border);

    border-radius:12px;

    background:var(--card);

    transition:.2s;
}

.topbar a:hover,
.topbar a.active{

    background:var(--green);

    color:#fff;

    border-color:var(--green);

    transform:translateY(-1px);
}


/* =====================================================
   المحتوى
===================================================== */

.container{

    width:min(1150px,94%);

    margin:auto;

    padding:
        28px 0
        80px;
}


/* =====================================================
   عنوان الصفحة
===================================================== */

.page-title{

    text-align:center;

    margin-bottom:24px;
}

.page-title h1{

    font-family:
        "Traditional Arabic",
        serif;

    font-size:42px;

    color:var(--green);

    line-height:1.4;
}

.page-title p{

    color:var(--muted);

    font-size:15px;
}


/* =====================================================
   البحث
===================================================== */

.search-box{

    display:flex;

    gap:9px;

    margin-bottom:20px;

    background:var(--card);

    padding:7px;

    border:
        1px solid var(--border);

    border-radius:16px;

    box-shadow:var(--shadow);
}

.search-input-wrap{

    position:relative;

    flex:1;
}

.search-icon{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

    pointer-events:none;
}

.search-box input{

    width:100%;

    padding:
        13px
        45px
        13px
        15px;

    border:0;

    border-radius:12px;

    background:transparent;

    color:var(--text);

    font-size:16px;

    outline:none;
}

.search-box button{

    background:var(--green);

    color:#fff;

    padding:
        10px 20px;

    border-radius:12px;

    font-weight:bold;

    transition:.2s;
}

.search-box button:hover{

    background:var(--green-dark);

    transform:translateY(-1px);
}


/* =====================================================
   التبويبات
===================================================== */

.tabs{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-bottom:20px;
}

.tab{

    padding:14px;

    border-radius:15px;

    background:var(--card);

    color:var(--text);

    border:
        1px solid var(--border);

    font-weight:bold;

    transition:.2s;
}

.tab:hover{

    border-color:var(--green);

    color:var(--green);
}

.tab.active{

    background:var(--green);

    color:#fff;

    border-color:var(--green);

    box-shadow:
        0 5px 15px rgba(8,127,91,.18);
}


/* =====================================================
   الأقسام
===================================================== */

.section{

    background:var(--card);

    border:
        1px solid var(--border);

    border-radius:22px;

    padding:22px;

    margin-bottom:20px;

    box-shadow:var(--shadow);
}

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:18px;
}

.section-title h2{

    color:var(--green);

    font-size:25px;
}

.count-text{

    color:var(--muted);

    font-size:13px;

    background:var(--soft);

    padding:5px 10px;

    border-radius:20px;
}


/* =====================================================
   شبكة الأذكار
===================================================== */

.azkar-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}


/* =====================================================
   بطاقة الذكر
===================================================== */

.zikr{

    position:relative;

    padding:22px;

    border:
        1px solid var(--border);

    border-radius:18px;

    background:var(--card);

    transition:
        transform .2s,
        border-color .2s,
        box-shadow .2s;

    overflow:hidden;
}

.zikr::before{

    content:"";

    position:absolute;

    top:0;

    right:0;

    width:5px;

    height:100%;

    background:var(--green);

    opacity:0;

    transition:.2s;
}

.zikr:hover{

    border-color:var(--green);

    transform:translateY(-3px);

    box-shadow:
        0 10px 25px rgba(8,127,91,.08);
}

.zikr:hover::before{
    opacity:1;
}

.zikr-head{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:15px;
}

.zikr-title{

    font-size:19px;

    font-weight:bold;

    color:var(--green);
}

.zikr-type{

    flex-shrink:0;

    font-size:12px;

    padding:5px 9px;

    border-radius:20px;

    background:var(--soft);

    color:var(--green);

    white-space:nowrap;
}

.zikr-text{

    font-family:
        "Traditional Arabic",
        "Amiri",
        serif;

    font-size:27px;

    line-height:2.2;

    color:var(--text);

    margin-bottom:18px;
}

.zikr-info{

    color:var(--muted);

    font-size:13px;

    margin-bottom:15px;
}


/* =====================================================
   الأزرار
===================================================== */

.zikr-actions{

    display:flex;

    gap:7px;

    flex-wrap:wrap;

    border-top:
        1px solid var(--border);

    padding-top:14px;
}

.btn{

    padding:
        9px 13px;

    border-radius:11px;

    font-size:14px;

    font-weight:bold;

    transition:.2s;
}

.btn:hover{

    transform:translateY(-1px);

    filter:brightness(.97);
}

.btn-save{

    background:var(--green);

    color:#fff;
}

.btn-copy{

    background:#e7f1ed;

    color:var(--green);
}

body.dark .btn-copy{

    background:#25332f;

    color:#fff;
}

.btn-share{

    background:#edf5f2;

    color:var(--green);
}

body.dark .btn-share{

    background:#25332f;

    color:#fff;
}

.btn-count{

    background:var(--soft-gold);

    color:#8b6919;
}

.delete{

    background:#ffe7e7;

    color:var(--danger);
}

body.dark .delete{

    background:#3a2424;

    color:#ff8c8c;
}


/* =====================================================
   العداد
===================================================== */

.counter{

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:14px;

    flex-wrap:wrap;
}

.counter button{

    background:var(--green);

    color:#fff;

    width:36px;

    height:36px;

    border-radius:10px;

    font-size:18px;

    transition:.2s;
}

.counter button:hover{

    background:var(--green-dark);

    transform:scale(1.04);
}

.counter-number{

    min-width:50px;

    text-align:center;

    padding:7px 10px;

    border-radius:10px;

    background:var(--soft);

    color:var(--green);

    font-weight:bold;
}

.counter-label{

    color:var(--muted);

    font-size:13px;
}

.progress{

    height:5px;

    width:100%;

    background:var(--border);

    border-radius:20px;

    overflow:hidden;

    margin-top:10px;
}

.progress-bar{

    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            var(--green),
            var(--green2)
        );

    border-radius:20px;

    transition:.25s;
}


/* =====================================================
   المحفوظات
===================================================== */

.saved-section{
    margin-top:25px;
}

.saved-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:14px;
}

.saved-card{

    padding:20px;

    border:
        1px solid var(--border);

    border-radius:18px;

    background:var(--card);

    transition:.2s;
}

.saved-card:hover{

    border-color:var(--green);

    transform:translateY(-2px);
}

.saved-title{

    color:var(--green);

    font-weight:bold;

    font-size:17px;

    margin-bottom:7px;
}

.saved-text{

    font-family:
        "Traditional Arabic",
        "Amiri",
        serif;

    font-size:26px;

    line-height:2;

    margin-bottom:15px;
}

.saved-actions{

    display:flex;

    gap:7px;

    flex-wrap:wrap;

    padding-top:13px;

    border-top:
        1px solid var(--border);
}


/* =====================================================
   لا يوجد نتائج
===================================================== */

.empty{

    text-align:center;

    padding:40px 20px;

    color:var(--muted);

    width:100%;
}

.empty-icon{

    display:block;

    font-size:38px;

    margin-bottom:8px;
}


/* =====================================================
   Toast
===================================================== */

.toast-container{

    position:fixed;

    left:20px;

    bottom:20px;

    z-index:9999;

    display:flex;

    flex-direction:column;

    gap:10px;

    pointer-events:none;
}

.toast{

    background:#173b35;

    color:#fff;

    padding:
        12px 17px;

    border-radius:13px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.2);

    font-size:14px;

    max-width:320px;

    animation:
        toastIn .3s ease;

}

.toast.success{
    border-right:4px solid #35c58f;
}

.toast.error{
    border-right:4px solid #ff6b6b;
}

@keyframes toastIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =====================================================
   زر العودة للأعلى
===================================================== */

.top-button{

    position:fixed;

    left:18px;

    bottom:18px;

    width:48px;

    height:48px;

    border-radius:50%;

    background:var(--green);

    color:#fff;

    font-size:20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.2);

    display:none;

    z-index:100;

    transition:.2s;
}

.top-button:hover{

    background:var(--green-dark);

    transform:translateY(-2px);
}


/* =====================================================
   Footer
===================================================== */

footer{

    text-align:center;

    padding:25px;

    color:var(--muted);

    border-top:
        1px solid var(--border);
}

footer strong{

    color:var(--green);
}


/* =====================================================
   Responsive
===================================================== */

@media(max-width:900px){

    .azkar-grid,
    .saved-grid{

        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    .container{

        width:94%;

        padding-top:22px;
    }

    .tabs{

        display:flex;

        overflow-x:auto;

        padding-bottom:3px;

        scrollbar-width:none;
    }

    .tabs::-webkit-scrollbar{
        display:none;
    }

    .tab{

        min-width:145px;

        white-space:nowrap;
    }

}

@media(max-width:600px){

    .header{

        padding:
            28px
            12px
            25px;
    }

    .logo{
        font-size:40px;
    }

    .creator{
        font-size:11px;
    }

    .theme{

        font-size:12px;

        padding:8px 10px;
    }

    .page-title h1{
        font-size:34px;
    }

    .page-title p{
        font-size:14px;
    }

    .section{
        padding:15px;
        border-radius:18px;
    }

    .section-title h2{
        font-size:21px;
    }

    .search-box{

        flex-direction:column;

        padding:6px;
    }

    .search-box button{

        width:100%;

        padding:12px;
    }

    .zikr{

        padding:17px;
    }

    .zikr-title{
        font-size:17px;
    }

    .zikr-text{

        font-size:24px;

        line-height:2.15;
    }

    .zikr-actions .btn,
    .saved-actions .btn{

        flex:1;

        min-width:85px;
    }

    .saved-text{
        font-size:24px;
    }

    .topbar{

        justify-content:flex-start;

        overflow-x:auto;

        flex-wrap:nowrap;

        scrollbar-width:none;
    }

    .topbar::-webkit-scrollbar{
        display:none;
    }

    .topbar a{

        flex-shrink:0;

        width:auto;

        white-space:nowrap;
    }

    .toast-container{

        left:12px;

        right:12px;

        bottom:12px;
    }

    .toast{
        max-width:none;
    }

}


/* =====================================================
   تقليل الحركة
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        scroll-behavior:auto!important;

        animation-duration:.01ms!important;

        animation-iteration-count:1!important;

        transition-duration:.01ms!important;
    }
}


/* =====================================================
   الطباعة
===================================================== */

@media print{

    .header,
    .topbar,
    .search-box,
    .tabs,
    .zikr-actions,
    .counter,
    .top-button,
    footer,
    .saved-section,
    .toast-container{

        display:none!important;
    }

    body{

        background:#fff;

        color:#000;
    }

    .container{

        width:100%;

        padding:0;
    }

    .section{

        box-shadow:none;

        border:0;
    }

    .zikr{

        break-inside:avoid;

        border:
            1px solid #ddd;
    }

}

</style>

</head>

     Header

<!-- =====================================================

<nav class="topbar">

     Main

<main class="container">

    <div class="page-title">

    </div>


    <!-- البحث -->

    <div class="search-box">

        <div class="search-input-wrap">

            <span class="search-icon">

            <input
                id="searchInput"
                type="search"
                placeholder="ابحث عن ذكر أو دعاء..."
                autocomplete="off"
                aria-label="البحث في الأذكار"

<div

<!-- Footer -->

<footer>

    © 2026 سراج

    <br>

    <strong>
        BY ADAM AHMED
    </strong>

    <br>

</footer>


<script>

/* =====================================================
   بيانات الأذكار
===================================================== */

const azkarData = {

    morning: [

        {
            title:"أصبحنا وأصبح الملك لله",
            text:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",
            count:1,
            type:"الصباح"
        },

/* =====================================================
   المتغيرات
===================================================== */

let currentCategory = "morning";

let counters = {};


/* =====================================================
   الأرقام العربية
===================================================== */

function ar(number){

    return String(number).replace(
        /[0-9]/g,
        digit => "٠١٢٣٤٥٦٧٨٩"[digit]
    );

}


/* =====================================================
   حماية HTML
===================================================== */

function escapeHTML(text){

    return String(text).replace(
        /[&<>"']/g,

        char => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[char])
    );

}


/* =====================================================
   Toast
===================================================== */

function showToast(message,type="success"){

    const container =
        document.getElementById("toastContainer");

    const toast =
        document.createElement("div");

    toast.className =
        `toast ${type}`;

    toast.textContent = message;

    container.appendChild(toast);

    setTimeout(()=>{

        toast.style.opacity="0";

        toast.style.transform="translateY(10px)";

        setTimeout(()=>{
            toast.remove();
        },250);

    },2500);

}


/* =====================================================
   المحفوظات
===================================================== */

function getSaved(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem("savedAzkar")
            );

        return Array.isArray(saved)
            ? saved
            : [];

    }catch(error){

        return [];

    }

}


function saveSaved(list){

    try{

        localStorage.setItem(
            "savedAzkar",
            JSON.stringify(list)
        );

    }catch(error){

        showToast(
            "تعذر حفظ الذكر على هذا الجهاز.",
            "error"
        );

    }

}


/* =====================================================
   حفظ ذكر
===================================================== */

function saveZikr(index){

    const item =
        azkarData[currentCategory][index];

    if(!item){
        return;
    }

    let saved = getSaved();

    const exists =
        saved.some(
            savedItem =>
                savedItem.text === item.text
        );

    if(exists){

        showToast(
            "❤️ الذكر موجود بالفعل في المحفوظات."
        );

        return;
    }

    saved.push({

        title:item.title,

        text:item.text,

        type:item.type,

        category:currentCategory

    });

    saveSaved(saved);

    renderSaved();

    showToast(
        "❤️ تم حفظ الذكر بنجاح."
    );

}


/* =====================================================
   حذف ذكر محفوظ
===================================================== */

function deleteSaved(index){

    const saved = getSaved();

    if(!saved[index]){
        return;
    }

    saved.splice(index,1);

    saveSaved(saved);

    renderSaved();

    showToast(
        "🗑️ تم حذف الذكر."
    );

}


/* =====================================================
   حذف جميع المحفوظات
===================================================== */

function clearSaved(){

    const saved = getSaved();

    if(!saved.length){

        showToast(
            "لا توجد أذكار محفوظة."
        );

        return;
    }

    const confirmed =
        confirm(
            "هل تريد حذف جميع الأذكار المحفوظة؟"
        );

    if(!confirmed){
        return;
    }

    localStorage.removeItem(
        "savedAzkar"
    );

    renderSaved();

    showToast(
        "🗑️ تم حذف جميع المحفوظات."
    );

}


/* =====================================================
   عرض المحفوظات
===================================================== */

function renderSaved(){

    const box =
        document.getElementById("savedGrid");

    const saved = getSaved();

    if(!saved.length){

        box.style.gridTemplateColumns =
            "1fr";

        box.innerHTML = `

            <div class="empty">

                <span class="empty-icon">
                    ❤️
                </span>

                لا توجد أذكار محفوظة حتى الآن.

                <br>

                اضغط على «حفظ ❤️» بجانب أي ذكر.

            </div>

        `;

        return;
    }

    box.style.gridTemplateColumns = "";

    box.innerHTML =
        saved.map(
            (item,index) => `

                <div class="saved-card">

                    <div class="saved-title">

                        ${escapeHTML(item.title || "ذكر محفوظ")}

                    </div>

                    <div class="zikr-type">

                        ${escapeHTML(item.type || "ذكر")}

                    </div>

                    <div class="saved-text">

                        ${escapeHTML(item.text)}

                    </div>

                    <div class="saved-actions">

                        <button
                            class="btn btn-copy"
                            onclick="copyTextByIndex(${index})">

                            📋 نسخ

                        </button>

                        <button
                            class="btn btn-share"
                            onclick="shareSaved(${index})">

                            📤 مشاركة

                        </button>

                        <button
                            class="btn delete"
                            onclick="deleteSaved(${index})">

                            🗑️ حذف

                        </button>

                    </div>

                </div>

            `
        ).join("");

}


/* =====================================================
   عرض القسم
===================================================== */

function showCategory(category,button){

    if(!azkarData[category]){
        return;
    }

    currentCategory = category;

    document
        .querySelectorAll(".tab")
        .forEach(tab =>
            tab.classList.remove("active")
        );

    button.classList.add("active");

    const titles = {

        morning:"🌅 أذكار الصباح",

        evening:"🌙 أذكار المساء",

        general:"🤲 أذكار عامة"

    };

    document.getElementById(
        "categoryTitle"
    ).textContent = titles[category];

    document.getElementById(
        "searchInput"
    ).value = "";

    renderAzkar();

}


/* =====================================================
   عرض الأذكار
===================================================== */

function renderAzkar(list=null){

    const box =
        document.getElementById("azkarGrid");

    const fullData =
        azkarData[currentCategory];

    const data =
        list === null
            ? fullData
            : list;

    document.getElementById(
        "countText"
    ).textContent =
        `${ar(data.length)} أذكار`;

    if(!data.length){

        box.innerHTML = `

            <div class="empty">

                <span class="empty-icon">
                    🔎
                </span>

                لا توجد نتائج للبحث.

                <br>

                جرّب كلمة أخرى.

            </div>

        `;

        return;
    }

    box.innerHTML =
        data.map(item => {

            /*
                مهم:
                نبحث عن الفهرس الأصلي داخل
                البيانات الأصلية، حتى لا يحدث
                خطأ عند الضغط على حفظ بعد البحث.
            */

            const originalIndex =
                fullData.indexOf(item);

            const key =
                currentCategory +
                "_" +
                originalIndex;

            const current =
                counters[key] || 0;

            const percent =
                item.count > 0
                    ? Math.min(
                        100,
                        Math.round(
                            current /
                            item.count *
                            100
                        )
                    )
                    : 0;

            return `

                <article class="zikr">

                    <div class="zikr-head">

                        <div class="zikr-title">

                            ${escapeHTML(item.title)}

                        </div>

                        <div class="zikr-type">

                            ${escapeHTML(item.type)}

                        </div>

                    </div>


                    <div class="zikr-text">

                        ${escapeHTML(item.text)}

                    </div>


                    <div class="zikr-info">

                        🔢 عدد التكرار المقترح:

                        <strong>
                            ${ar(item.count)}
                        </strong>

                    </div>


                    <div class="zikr-actions">

                        <button
                            class="btn btn-save"
                            onclick="saveZikr(${originalIndex})">

                            ❤️ حفظ

                        </button>


                        <button
                            class="btn btn-copy"
                            onclick="copyText(${JSON.stringify(item.text)})">

                            📋 نسخ

                        </button>


                        <button
                            class="btn btn-share"
                            onclick="shareText(${JSON.stringify(item.text)})">

                            📤 مشاركة

                        </button>

                    </div>


                    <div class="counter">

                        <button
                            onclick="increaseCounter('${key}',${item.count})"
                            aria-label="زيادة العداد">

                            +

                        </button>

                        <div
                            class="counter-number"
                            id="counter-${key}">

                            ${ar(current)}

                        </div>

                        <button
                            onclick="resetCounter('${key}')"
                            aria-label="إعادة العداد">

                            ↻

                        </button>

                        <span class="counter-label">

                            من ${ar(item.count)}

                        </span>

                    </div>


                    <div class="progress">

                        <div
                            class="progress-bar"
                            id="progress-${key}"
                            style="width:${percent}%">

                        </div>

                    </div>

                </article>

            `;

        }).join("");

}


/* =====================================================
   عداد الذكر
===================================================== */

function increaseCounter(key,max){

    if(!counters[key]){
        counters[key] = 0;
    }

    if(counters[key] < max){

        counters[key]++;
    }

    updateCounterUI(key,max);

    if(counters[key] === max){

        if(navigator.vibrate){

            navigator.vibrate([
                100,
                50,
                100
            ]);

        }

        showToast(
            "✨ أحسنت! اكتمل العدد."
        );

    }

}


/* =====================================================
   تحديث العداد
===================================================== */

function updateCounterUI(key,max){

    const number =
        document.getElementById(
            "counter-"+key
        );

    const progress =
        document.getElementById(
            "progress-"+key
        );

    const current =
        counters[key] || 0;

    if(number){

        number.textContent =
            ar(current);
    }

    if(progress){

        const percent =
            max > 0
                ? Math.min(
                    100,
                    Math.round(
                        current /
                        max *
                        100
                    )
                )
                : 0;

        progress.style.width =
            percent + "%";
    }

}


/* =====================================================
   إعادة العداد
===================================================== */

function resetCounter(key){

    counters[key] = 0;

    const number =
        document.getElementById(
            "counter-"+key
        );

    const progress =
        document.getElementById(
            "progress-"+key
        );

    if(number){

        number.textContent =
            "٠";
    }

    if(progress){

        progress.style.width =
            "0%";
    }

}


/* =====================================================
   البحث
===================================================== */

function searchAzkar(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const word =
        input.value
            .trim()
            .toLowerCase();

    if(!word){

        renderAzkar();

        return;
    }

    const data =
        azkarData[currentCategory];

    const results =
        data.filter(item =>

            item.title
                .toLowerCase()
                .includes(word)

            ||

            item.text
                .toLowerCase()
                .includes(word)

            ||

            item.type
                .toLowerCase()
                .includes(word)

        );

    renderAzkar(results);

}


function clearSearch(){

    const input =
        document.getElementById(
            "searchInput"
        );

    input.value = "";

    renderAzkar();

    input.focus();

}


/* =====================================================
   النسخ
===================================================== */

async function copyText(text){

    try{

        if(
            navigator.clipboard &&
            window.isSecureContext
        ){

            await navigator.clipboard.writeText(
                text
            );

        }else{

            fallbackCopy(text);

        }

        showToast(
            "📋 تم نسخ الذكر."
        );

    }catch(error){

        showToast(
            "تعذر نسخ الذكر.",
            "error"
        );

    }

}


/* =====================================================
   نسخة احتياطية للنسخ
===================================================== */

function fallbackCopy(text){

    const textarea =
        document.createElement("textarea");

    textarea.value = text;

    textarea.style.position =
        "fixed";

    textarea.style.opacity =
        "0";

    document.body.appendChild(
        textarea
    );

    textarea.focus();

    textarea.select();

    const success =
        document.execCommand("copy");

    textarea.remove();

    if(!success){

        throw new Error(
            "Copy failed"
        );

    }

}


/* =====================================================
   نسخ محفوظ
===================================================== */

function copyTextByIndex(index){

    const saved = getSaved();

    if(!saved[index]){
        return;
    }

    copyText(
        saved[index].text
    );

}


/* =====================================================
   المشاركة
===================================================== */

async function shareText(text){

    const shareData = {

        title:"ذكر من سراج",

        text:
            `🤲 ${text}\n\n` +
            `📖 سراج\n` +
            `BY ADAM AHMED`

    };

    if(
        navigator.share
    ){

        try{

            await navigator.share(
                shareData
            );

            showToast(
                "📤 تمت المشاركة."
            );

        }catch(error){

            /*
                المستخدم قد يغلق نافذة المشاركة،
                لذلك لا نعرض رسالة خطأ.
            */

        }

        return;
    }

    /*
        إذا كان المتصفح لا يدعم المشاركة،
        ننسخ النص بدلًا منها.
    */

    await copyText(
        shareData.text
    );

}


function shareSaved(index){

    const saved = getSaved();

    if(!saved[index]){
        return;
    }

    shareText(
        saved[index].text
    );

}

        document.body.classList.contains(
            "dark"
        );

}

}
