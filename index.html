<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الأذكار والأدعية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Tahoma", "Arial", sans-serif;
      background: #06110e;
      color: #fff;
      min-height: 100vh;
      padding: 0 20px 40px;
    }

    .container {
      width: min(1440px, 100%);
      margin: auto;
    }

    /* =========================
       العناوين
    ========================= */

    .section {
      background: #101f1b;
      border: 1px solid #263d37;
      border-radius: 24px;
      padding: 28px 24px;
      margin-bottom: 20px;
    }

    .section-title {
      color: #008b68;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 28px;
    }

    /* =========================
       الكروت
    ========================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .card {
      min-height: 195px;
      background: #101f1b;
      border: 1px solid #29413b;
      border-radius: 18px;
      padding: 26px 22px 20px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      transition: 0.25s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #008b68;
      box-shadow: 0 8px 25px rgba(0, 139, 104, 0.08);
    }

    .card-title {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .dhikr {
      color: #fff;
      font-size: 20px;
      line-height: 2;
      text-align: right;
      min-height: 55px;
    }

    /* =========================
       الأزرار
    ========================= */

    .btn {
      border: none;
      cursor: pointer;
      border-radius: 15px;
      padding: 12px 22px;
      font-size: 16px;
      font-family: inherit;
      transition: 0.2s;
    }

    .save-btn {
      background: #008b68;
      color: white;
      align-self: flex-start;
    }

    .save-btn:hover {
      background: #00a87d;
      transform: scale(1.03);
    }

    .delete-btn {
      background: #ffe7e7;
      color: #e33b3b;
      align-self: flex-start;
    }

    .delete-btn:hover {
      background: #ffd2d2;
    }

    /* =========================
       إضافة ذكر
    ========================= */

    .add-section {
      margin-top: 20px;
    }

    .form {
      display: grid;
      grid-template-columns: 180px 1fr auto;
      gap: 12px;
      align-items: center;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0a1714;
      border: 1px solid #29413b;
      color: white;
      border-radius: 14px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 55px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #008b68;
    }

    .add-btn {
      background: #008b68;
      color: white;
      white-space: nowrap;
    }

    .add-btn:hover {
      background: #00a87d;
    }

    /* =========================
       حالة عدم وجود محفوظات
    ========================= */

    .empty {
      text-align: center;
      color: #81918d;
      padding: 35px 10px;
      font-size: 18px;
    }

    /* =========================
       رسالة
    ========================= */

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);

      background: #008b68;
      color: white;
      padding: 13px 25px;
      border-radius: 14px;

      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================
       Responsive
    ========================= */

    @media (max-width: 1100px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .form {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      body {
        padding: 0 10px 30px;
      }

      .section {
        padding: 22px 14px;
        border-radius: 18px;
      }

      .section-title {
        font-size: 23px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 180px;
      }

      .card-title {
        font-size: 20px;
      }

      .dhikr {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =========================
         الأذكار والأدعية
    ========================== -->

    <section class="section">

      <h1 class="section-title">
        🙌 الأذكار والأدعية
      </h1>

      <div class="cards" id="mainCards">

        <!-- ذكر الصباح -->
        <div class="card">
          <div>
            <div class="card-title">
              🌅 أذكار الصباح
            </div>

            <div class="dhikr">
              أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ
            </div>
          </div>

          <button
            class="btn save-btn"
            onclick="saveDhikr(
              'أذكار الصباح',
              'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ'
            )"
          >
            حفظ 💗
          </button>
        </div>


        <!-- ذكر المساء -->
        <div class="card">
          <div>
            <div class="card-title">
              🌆 أذكار المساء
            </div>

            <div class="dhikr">
              أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ
            </div>
          </div>

          <button
            class="btn save-btn"
            onclick="saveDhikr(
              'أذكار المساء',
              'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ'
            )"
          >
            حفظ 💗
          </button>
        </div>


        <!-- ذكر -->
        <div class="card">
          <div>
            <div class="card-title">
              🙌 ذكر
            </div>

            <div class="dhikr">
              سُبْحَانَ اللَّهِ وَبِحَمْدِهِ
            </div>
          </div>

          <button
            class="btn save-btn"
            onclick="saveDhikr(
              'ذكر',
              'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ'
            )"
          >
            حفظ 💗
          </button>
        </div>


        <!-- الاستغفار -->
        <div class="card">
          <div>
            <div class="card-title">
              🙌 الاستغفار
            </div>

            <div class="dhikr">
              أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ
            </div>
          </div>

          <button
            class="btn save-btn"
            onclick="saveDhikr(
              'الاستغفار',
              'أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ'
            )"
          >
            حفظ 💗
          </button>
        </div>

      </div>
    </section>


    <!-- =========================
         الأذكار المحفوظة
    ========================== -->

    <section class="section">

      <h2 class="section-title">
        💗 أذكاري المحفوظة
      </h2>

      <div
        class="cards"
        id="savedCards"
      ></div>

    </section>


    <!-- =========================
         إضافة ذكر جديد
    ========================== -->

    <section class="section add-section">

      <h2 class="section-title">
        ➕ إضافة ذكر جديد
      </h2>

      <div class="form">

        <select id="newTitle">
          <option value="ذكر">🙌 ذكر</option>
          <option value="دعاء">🤲 دعاء</option>
          <option value="أذكار الصباح">🌅 أذكار الصباح</option>
          <option value="أذكار المساء">🌆 أذكار المساء</option>
          <option value="الاستغفار">🙌 الاستغفار</option>
        </select>

        <textarea
          id="newDhikr"
          placeholder="اكتب الذكر أو الدعاء هنا..."
        ></textarea>

        <button
          class="btn add-btn"
          onclick="addNewDhikr()"
        >
          إضافة
        </button>

      </div>

    </section>

  </div>


  <!-- رسالة صغيرة -->
  <div
    class="toast"
    id="toast"
  ></div>


  <script>

    /* =====================================
       البيانات المحفوظة
    ===================================== */

    let savedDhikrs =
      JSON.parse(localStorage.getItem("savedDhikrs")) || [];


    /* =====================================
       عرض المحفوظات
    ===================================== */

    function renderSaved() {

      const container =
        document.getElementById("savedCards");

      container.innerHTML = "";


      if (savedDhikrs.length === 0) {

        container.innerHTML = `
          <div class="empty">
            لا توجد أذكار محفوظة حتى الآن 💗
          </div>
        `;

        return;
      }


      savedDhikrs.forEach((item, index) => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

          <div>

            <div class="card-title">
              ${item.title}
            </div>

            <div class="dhikr">
              ${item.text}
            </div>

          </div>

          <button
            class="btn delete-btn"
            onclick="deleteDhikr(${index})"
          >
            حذف
          </button>

        `;

        container.appendChild(card);

      });

    }


    /* =====================================
       حفظ ذكر
    ===================================== */

    function saveDhikr(title, text) {

      const exists =
        savedDhikrs.some(item =>
          item.text === text
        );


      if (exists) {

        showToast("الذكر محفوظ بالفعل 💗");

        return;
      }


      savedDhikrs.push({
        title: title,
        text: text
      });


      localStorage.setItem(
        "savedDhikrs",
        JSON.stringify(savedDhikrs)
      );


      renderSaved();

      showToast("تم حفظ الذكر 💗");

    }


    /* =====================================
       حذف ذكر
    ===================================== */

    function deleteDhikr(index) {

      savedDhikrs.splice(index, 1);


      localStorage.setItem(
        "savedDhikrs",
        JSON.stringify(savedDhikrs)
      );


      renderSaved();

      showToast("تم حذف الذكر");

    }


    /* =====================================
       إضافة ذكر جديد
    ===================================== */

    function addNewDhikr() {

      const title =
        document.getElementById("newTitle").value;

      const text =
        document.getElementById("newDhikr").value.trim();


      if (!text) {

        showToast("اكتب الذكر أولاً");

        return;
      }


      saveDhikr(title, text);


      document.getElementById("newDhikr").value = "";

    }


    /* =====================================
       Toast
    ===================================== */

    let toastTimer;


    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");


      clearTimeout(toastTimer);


      toastTimer = setTimeout(() => {

        toast.classList.remove("show");

      }, 2200);

    }


    /* =====================================
       تشغيل الصفحة
    ===================================== */

    renderSaved();

  </script>

</body>
</html>
